<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المشرف - تبرعات القرية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap topbar">
    <div>
      <h1>🛠 لوحة المشرف</h1>
      <p>توثيق استلام التبرعات وإدارة الحالات</p>
    </div>
    <a class="admin-link" href="about.html">من نحن</a>
    <a class="admin-link" href="index.html">→ صفحة المتبرعين</a>
  </div>
</header>

<div class="wrap">
  <div class="card" id="loginCard">
    <h3>تسجيل الدخول</h3>
    <label>اسم المشرف</label>
    <input id="uname" placeholder="مثال: أحمد" autocomplete="username">
    <label>كلمة السر</label>
    <input type="password" id="pw" placeholder="••••••" autocomplete="current-password">
    <br><br>
    <button onclick="login()">دخول</button>
    <div class="notice">أول دخول: استعمل اسم <b>admin</b> وكلمة سر المشرف الأصلية.</div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="admin-bar">
        <button class="ghost small" onclick="logout()">تسجيل خروج</button>
        <button class="small" onclick="exportCSV()">⬇ تصدير CSV</button>
        <select id="filterStatus" onchange="loadDonations()" style="max-width:200px">
          <option value="">كل التبرعات</option>
          <option value="pending">⏳ بانتظار التوثيق فقط</option>
          <option value="verified">✅ الموثقة فقط</option>
        </select>
      </div>
      <div id="stats"></div>
    </div>

    <div class="card">
      <h3>📄 صفحة من نحن</h3>
      <label>النص (اتركه فارغا لاستخدام النص الافتراضي)</label>
      <textarea id="aboutTextBox" rows="6" placeholder="اكتب نبذة عن المجموعة..."></textarea>
      <br><br>
      <button onclick="saveAbout()">حفظ النص</button>
    </div>

    <div class="card" id="adminsCard">
      <h3>👥 المشرفون</h3>
      <div class="notice">الحساب الحالي: <b id="meName"></b></div>
      <div id="adminsList"></div>
      <label>اسم مشرف جديد</label>
      <input id="aName" placeholder="مثال: أحمد">
      <label>كلمة السر (6 أحرف على الأقل)</label>
      <input id="aPass" type="password" placeholder="••••••">
      <br><br>
      <button onclick="createAdmin()">إضافة مشرف</button>
    </div>

    <div class="card">
      <h3>➕ حالة جديدة</h3>
      <label>عنوان الحالة</label>
      <input id="nTitle" placeholder="مثال: عملية لمريض...">
      <label>اسم المريض/الحالة</label>
      <input id="nPatient" placeholder="مثال: محمد...">
      <label>الوصف</label>
      <textarea id="nDesc" rows="3" placeholder="تفاصيل الحالة..."></textarea>
      <label>المبلغ المستهدف ($)</label>
      <input id="nTarget" type="number" min="0" placeholder="1000">
      <label>رقم Wish (اختياري)</label>
      <input id="nWish" placeholder="06XXXXXXXX" dir="ltr">
      <br><br>
      <button onclick="createCase()">نشر الحالة</button>
    </div>

    <div class="card">
      <h3>📋 الحالات</h3>
      <div id="casesAdmin"></div>
    </div>

    <div class="card">
      <h3>💰 التبرعات (مع أرقام الهواتف)</h3>
      <div id="donationsAdmin"></div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
